apiVersion: v1
kind: ServiceAccount
metadata:
  name: fuzzy-autoscaler-sa
  namespace: llm-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fuzzy-autoscaler-role
  namespace: llm-autoscaler
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fuzzy-autoscaler-binding
  namespace: llm-autoscaler
subjects:
  - kind: ServiceAccount
    name: fuzzy-autoscaler-sa
    namespace: llm-autoscaler
roleRef:
  kind: Role
  name: fuzzy-autoscaler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuzzy-autoscaler
  namespace: llm-autoscaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fuzzy-autoscaler
  template:
    metadata:
      labels:
        app: fuzzy-autoscaler
    spec:
      serviceAccountName: fuzzy-autoscaler-sa
      containers:
        - name: autoscaler
          image: manassharma11/llm-fuzzy-autoscaler:latest
          imagePullPolicy: Always
          command: ["python", "run_autoscaler.py", "--backend", "k8s"]
          env:
            - name: AUTOSCALER_API_URL
              value: "http://api:8000/autoscaler/evaluate"
            - name: K8S_NAMESPACE
              value: "llm-autoscaler"
            - name: AUTOSCALER_POLL_SECONDS
              value: "3"
