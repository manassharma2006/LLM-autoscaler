name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi-service/requirements.txt
      - run: pip install -r requirements.txt pyyaml
      - run: python -m unittest discover -s tests
      - name: Validate K8s manifests
        run: for f in k8s/*.yaml; do python -c "import yaml, sys; list(yaml.safe_load_all(open(sys.argv[1])))" "$f"; done

  docker-build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: fastapi-service
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/llm-fuzzy-autoscaler:latest
